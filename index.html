<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishna Sharma | GitHub Repositories</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .repo-container {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .repo-card {
            background: #020617;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .repo-card:hover {
            transform: translateY(-5px);
        }

        .repo-card a {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        .repo-card p {
            font-size: 14px;
            margin: 10px 0;
            color: #cbd5f5;
        }

        .tags {
            font-size: 12px;
            opacity: 0.8;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <header>
        <h1>👋 Krishna Sharma</h1>
        <p>All my GitHub repositories in one place</p>
    </header>

    <section class="repo-container" id="repos">
        <p>Loading repositories...</p>
    </section>

    <footer>
        © 2026 • Powered by GitHub Pages
    </footer>

    <script>
        const username = "Krishna6438";
        const repoContainer = document.getElementById("repos");

        fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`)
            .then(res => res.json())
            .then(repos => {
                repoContainer.innerHTML = "";

                repos.forEach(repo => {
                    const card = document.createElement("div");
                    card.className = "repo-card";

                    card.innerHTML = `
          <a href="${repo.html_url}" target="_blank">${repo.name}</a>
          <p>${repo.description || "No description provided."}</p>
          <div class="tags">
            ⭐ ${repo.stargazers_count} • 🍴 ${repo.forks_count} • ${repo.language || "Unknown"}
          </div>
        `;

                    repoContainer.appendChild(card);
                });
            })
            .catch(err => {
                repoContainer.innerHTML = "<p>Failed to load repositories.</p>";
                console.error(err);
            });
    </script>

</body>

</html>
